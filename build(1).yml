name: Construieste APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Ia fisierele
        uses: actions/checkout@v4

      - name: Pregateste Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaleaza Java si bibliotecile de sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk git zip unzip autoconf automake libtool libtool-bin \
            pkg-config cmake build-essential ccache libffi-dev libssl-dev \
            zlib1g-dev libncurses-dev libltdl-dev patch

      - name: Instaleaza Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython==0.29.36" buildozer

      - name: Pastreaza fisierele descarcate intre rulari
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Compileaza APK-ul
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
          yes | buildozer -v android debug

      - name: Arata ce a iesit
        if: always()
        run: ls -la bin/ || echo "folderul bin nu exista"

      - name: Publica APK-ul
        uses: actions/upload-artifact@v4
        with:
          name: ExamenANRE-APK
          path: bin/*.apk
          if-no-files-found: error
